allowBuilds:
  esbuild: set this to true or false
  sharp: set this to true or false
# Gerado pelo pnpm ao instalar next@16.3.2 com menos de 24h de publicacao
# (guarda minimumReleaseAge). Pode ser removido depois que o release envelhecer.
minimumReleaseAgeExclude:
  - '@next/env@16.3.2'
  - '@next/swc-darwin-arm64@16.3.2'
  - '@next/swc-darwin-x64@16.3.2'
  - '@next/swc-linux-arm64-gnu@16.3.2'
  - '@next/swc-linux-arm64-musl@16.3.2'
  - '@next/swc-linux-x64-gnu@16.3.2'
  - '@next/swc-linux-x64-musl@16.3.2'
  - '@next/swc-win32-arm64-msvc@16.3.2'
  - '@next/swc-win32-x64-msvc@16.3.2'
  - next@16.3.2
onlyBuiltDependencies:
  - esbuild
  - sharp

# O exceljs depende de uuid vulneravel (GHSA-w5hq-g745-h8pq, buffer bounds em
# v3/v5/v6). O override forca a versao corrigida sem esperar o upstream.
overrides:
  uuid: '>=11.1.1'
  # O postcss (via next) depende de nanoid < 3.3.18 (GHSA nanoid: geradores
  # customizados entram em loop infinito com size zero). Override forca a
  # versao corrigida (linha 3.x, CJS) ate o upstream atualizar.
  'postcss>nanoid': '>=3.3.18 <4'
